<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Hanap-Bidet">
  <!-- Maskable icon: glyph is centered within the inner 80% safe area
       (51.2px padding each side) so platform masks (circle, squircle,
       rounded-square) do not clip the letterform. -->
  <rect width="512" height="512" fill="#7B1113"/>
  <g fill="#F7F4EE" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" text-anchor="middle">
    <text x="256" y="288" font-size="170" font-weight="700" letter-spacing="-6">HB</text>
    <text x="256" y="350" font-size="34" font-weight="500" letter-spacing="8">UPD</text>
  </g>
</svg>
